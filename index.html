<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Companion</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef3f5;--card:#fff;--ink:#12232d;--mute:#5d707b;--line:#d5e0e5;--acc:#0e7c66;--acc2:#d9a21b;--bad:#c8553d;--track:#dfe9ed;--focus:#0b3d4a;--focusInk:#e9f6f3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a21;--card:#152630;--ink:#e6f0f3;--mute:#8aa0ab;--line:#243945;--acc:#2fc4a1;--acc2:#e8b93a;--bad:#e3735b;--track:#1f3541;--focus:#0a2a33}}
:root[data-theme="dark"]{--bg:#0d1a21;--card:#152630;--ink:#e6f0f3;--mute:#8aa0ab;--line:#243945;--acc:#2fc4a1;--acc2:#e8b93a;--bad:#e3735b;--track:#1f3541;--focus:#0a2a33}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.45}
main{max-width:560px;margin:0 auto;padding:16px 16px 56px}
h1{font-size:22px;margin:4px 0 2px;font-weight:800}
.sub{color:var(--mute);font-size:14px;margin:0 0 12px}
button{font:inherit}
.b{font-weight:600;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:9px 12px;cursor:pointer;min-height:40px}
.b.p{background:var(--acc);border-color:var(--acc);color:#fff}.b.s{background:var(--bad);border-color:var(--bad);color:#fff}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
input[type=text],input[type=time],textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-width:0}
input[type=text]{flex:1}
.up{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px}
.up span{font-size:14px}
.focus{background:var(--focus);color:var(--focusInk);border-radius:22px;padding:18px;margin-bottom:12px;text-align:center}
.focus.brk{background:#7a5a0d}
.focus .ph{font-size:15px;opacity:.85}
.focus .big{font-size:64px;font-weight:800;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums}
.focus .meta{font-size:14px;opacity:.85;margin-bottom:12px}
.focus .row{justify-content:center}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 0}
.nav button.a{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;cursor:pointer}
.nav button:disabled{opacity:.35;cursor:default}
.nav .d{flex:1;text-align:center;font-weight:600}
.link{background:none;border:0;color:var(--acc);font-size:13px;cursor:pointer;padding:2px}
.hero{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;align-items:center;gap:14px}
.ring{width:140px;height:140px;flex:none}.ring text{fill:var(--ink);font-family:inherit}
.hs{flex:1;min-width:0}.hs b{font-size:28px;font-weight:800}.hs div{color:var(--mute);font-size:14px}.hs .msg{color:var(--ink);margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
.stat b{display:block;font-size:20px;font-weight:800}.stat span{font-size:12px;color:var(--mute)}
.sess{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--track);border-radius:16px;padding:12px;margin:10px 0}
.sess.full{border-left-color:var(--acc)}.sess.part{border-left-color:var(--acc2)}.sess.run{border-left-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row+.row{margin-top:8px}
.t{font-weight:600}.min{font-weight:800;font-size:18px;margin-left:auto;font-variant-numeric:tabular-nums}.min small{font-weight:400;color:var(--mute);font-size:13px}
.chip{font-size:12px;border:1px solid var(--line);background:var(--bg);color:var(--mute);border-radius:99px;padding:4px 10px;cursor:pointer}
.bar{height:8px;border-radius:6px;background:var(--track);overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--acc)}
.sec{margin:22px 0 8px;font-size:16px;font-weight:800}
.chart{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;gap:6px;align-items:flex-end;height:150px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--mute)}
.col i{width:100%;max-width:28px;border-radius:6px 6px 0 0;background:var(--acc);min-height:2px;display:block}
.col.low i{background:var(--acc2)}.col.none i{background:var(--track)}.col em{font-style:normal;color:var(--ink);font-weight:600}
.hist{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.hist button{display:flex;justify-content:space-between;width:100%;padding:11px 12px;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);font-size:14px;cursor:pointer;text-align:left}
.hist button:first-child{border-top:0}.hist p{margin:0;padding:12px;color:var(--mute);font-size:14px}
.data{display:none;margin-top:10px}.data.on{display:block}
textarea{width:100%;height:110px;font-size:12px}
.note{font-size:12px;color:var(--mute);margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;max-width:90%;z-index:9}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:380px){.hero{flex-direction:column}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<main>
  <h1>Study companion</h1>
  <p class="sub">Four 2-hour sessions a day. Timers, breaks and totals update live.</p>

  <div id="upnext" class="up"></div>

  <section id="focus" class="focus" hidden aria-live="off">
    <div class="ph" id="fph"></div>
    <div class="big" id="fbig">00:00</div>
    <div class="meta" id="fmeta"></div>
    <div class="row"><button class="b s" id="fstop">Stop session</button><button class="b" id="fskip">Skip phase</button></div>
  </section>

  <div class="nav">
    <button class="a" id="prev" aria-label="Previous day">‹</button>
    <div class="d"><span id="dl"></span><br><button class="link" id="today">Jump to today</button></div>
    <button class="a" id="next" aria-label="Next day">›</button>
  </div>

  <div class="hero">
    <svg class="ring" id="ring" viewBox="0 0 200 200" role="img" aria-label="Daily progress"></svg>
    <div class="hs"><b id="tot"></b><div id="pct"></div><div class="msg" id="msg"></div></div>
  </div>
  <div class="stats">
    <div class="stat"><b id="wk">0h</b><span>Last 7 days</span></div>
    <div class="stat"><b id="adh">0%</b><span>7-day adherence</span></div>
    <div class="stat"><b id="stk">0</b><span>Day streak (80%+)</span></div>
  </div>

  <div id="sessions"></div>

  <div class="sec">Last 7 days</div>
  <div class="chart" id="chart"></div>
  <div class="sec">History</div>
  <div class="hist" id="hist"></div>

  <div class="sec">Settings</div>
  <div class="row">
    <label>Focus <input type="number" id="cf" min="10" max="90" style="width:64px;font:inherit;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)"> min</label>
    <label>Break <input type="number" id="cb" min="1" max="30" style="width:64px;font:inherit;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)"> min</label>
    <label><input type="checkbox" id="cs"> Sound</label>
  </div>
  <div class="row" style="margin-top:12px">
    <button class="b" id="exp">Export backup</button>
    <button class="b" id="imp">Restore backup</button>
    <button class="b" id="clr">Clear all data</button>
  </div>
  <div class="data" id="data">
    <textarea id="ta" aria-label="Backup data" placeholder="Backup appears here. Paste a backup and tap Load to restore."></textarea>
    <div class="row"><button class="b p" id="load">Load backup</button></div>
  </div>
  <p class="note">Saved in this browser only. Export a backup before clearing site data.</p>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
var KEY='studycompanion.v2',CAP=7200,DEF=['06:00','12:00','18:00','22:00'];
var db={days:{},times:DEF.slice(),timer:null,cfg:{focus:50,brk:10,sound:true}};
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&p.days){db=p;db.times=db.times||DEF.slice();db.cfg=Object.assign({focus:50,brk:10,sound:true},db.cfg)}}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
function $(i){return document.getElementById(i)}
function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parse(k){var a=k.split('-');return new Date(+a[0],+a[1]-1,+a[2])}
function shift(k,n){var d=parse(k);d.setDate(d.getDate()+n);return fmt(d)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
function hm(s){var m=Math.floor(s/60),h=Math.floor(m/60),r=m%60;return h?(r?h+'h '+r+'m':h+'h'):r+'m'}
function mmss(s){s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
var cur=fmt(new Date()),lastKey=null,actx=null;
function get(k){if(!db.days[k])db.days[k]=[0,1,2,3].map(function(){return{sub:'',sec:0,note:''}});return db.days[k]}
function running(k,i){return db.timer&&db.timer.date===k&&db.timer.i===i}
function elapsed(){return db.timer?(Date.now()-db.timer.start)/1000:0}
function sess(k,i){var x=db.days[k]&&db.days[k][i];return x?(+x.sec||0)+(running(k,i)?elapsed():0):0}
function daySec(k){var t=0;for(var i=0;i<4;i++)t+=Math.min(CAP,sess(k,i));return t}
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove('on')},3500)}
function beep(n){if(!db.cfg.sound||!actx)return;try{for(var j=0;j<(n||1);j++){var o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;g.gain.value=.12;o.connect(g);g.connect(actx.destination);var t=actx.currentTime+j*.3;o.start(t);o.stop(t+.18)}}catch(e){}}
function pol(r,d){var a=d*Math.PI/180;return(100+r*Math.cos(a)).toFixed(2)+' '+(100+r*Math.sin(a)).toFixed(2)}
function arc(a,b){return'M'+pol(80,a)+' A80 80 0 0 1 '+pol(80,b)}

function phase(){
  var c=db.cfg,f=c.focus*60,cy=(c.focus+c.brk)*60,e=elapsed(),p=e%cy,br=p>=f;
  return{brk:br,left:br?cy-p:f-p,key:Math.floor(e/cy)+(br?'b':'f'),n:Math.floor(e/cy)+1};
}
function stopTimer(){
  var t=db.timer;if(!t)return;
  var d=get(t.date);d[t.i].sec=Math.min(CAP*1.5,(+d[t.i].sec||0)+elapsed());
  db.timer=null;lastKey=null;save();
}
function startTimer(i){
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
  stopTimer();db.timer={date:cur,i:i,start:Date.now()};lastKey='1f';save();render();
}

function render(){
  var d=get(cur),today=fmt(new Date()),isT=cur===today;
  $('dl').textContent=parse(cur).toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'})+(isT?' (today)':'');
  $('today').hidden=isT;$('next').disabled=cur>=today;
  $('cf').value=db.cfg.focus;$('cb').value=db.cfg.brk;$('cs').checked=!!db.cfg.sound;
  var subs={};Object.keys(db.days).sort().reverse().forEach(function(k){db.days[k].forEach(function(x){if(x.sub&&Object.keys(subs).length<6)subs[x.sub]=1})});
  var chips=Object.keys(subs).map(function(s){return'<button class="chip" data-chip="'+esc(s)+'">'+esc(s)+'</button>'}).join('');
  var h='';
  d.forEach(function(x,i){
    h+='<div class="sess" id="s'+i+'"><div class="row"><span class="t">Session '+(i+1)+'</span><input type="time" value="'+(db.times[i]||'')+'" data-t="'+i+'" aria-label="Session '+(i+1)+' start time"><span class="min" id="m'+i+'"></span></div>'+
    '<div class="row"><input type="text" placeholder="Subject or topic" value="'+esc(x.sub)+'" data-s="'+i+'" aria-label="Subject"></div>'+
    (chips?'<div class="row">'+chips.replace(/data-chip=/g,'data-ci="'+i+'" data-chip=')+'</div>':'')+
    '<div class="row"><button class="b" id="tb'+i+'" data-tm="'+i+'"></button>'+(isT||true?'<button class="b" data-a="'+i+'|-15">−15</button><button class="b" data-a="'+i+'|15">+15</button><button class="b" data-a="'+i+'|full">Full 2h</button><button class="b" data-a="'+i+'|0">Reset</button>':'')+'</div>'+
    '<div class="row"><input type="text" placeholder="Note: what you covered, what slipped" value="'+esc(x.note)+'" data-n="'+i+'" aria-label="Note"></div>'+
    '<div class="bar"><i id="bar'+i+'"></i></div></div>';
  });
  $('sessions').innerHTML=h;
  tick();
}

function paint(){
  var today=fmt(new Date()),sum=daySec(cur),svg='';
  for(var i=0;i<4;i++){
    var m=Math.min(CAP,sess(cur,i)),a=-90+i*90+4,b=-90+(i+1)*90-4;
    svg+='<path d="'+arc(a,b)+'" stroke="var(--track)" stroke-width="16" stroke-linecap="round" fill="none"/>';
    if(m>1)svg+='<path d="'+arc(a,a+(b-a)*m/CAP)+'" stroke="'+(m>=CAP?'var(--acc)':'var(--acc2)')+'" stroke-width="16" stroke-linecap="round" fill="none"/>';
    var el=$('m'+i);if(el){el.innerHTML=hm(sess(cur,i))+' <small>/ 2h</small>';
      $('bar'+i).style.width=Math.min(100,m/CAP*100)+'%';
      var c=$('s'+i);c.className='sess'+(running(cur,i)?' run':m>=CAP?' full':m>0?' part':'');
      var r=running(cur,i),tb=$('tb'+i);var txt=r?'Stop timer':'Start timer';if(tb.textContent!==txt){tb.textContent=txt;tb.className='b '+(r?'s':'p')}}
  }
  svg+='<text x="100" y="108" text-anchor="middle" font-size="30" font-weight="800">'+Math.round(sum/288)+'%</text>';
  $('ring').innerHTML=svg;$('ring').setAttribute('aria-label','Daily progress '+Math.round(sum/288)+' percent');
  $('tot').textContent=hm(sum)+' / 8h';
  var done=0;for(i=0;i<4;i++)if(sess(cur,i)>=CAP)done++;
  $('pct').textContent=done+' of 4 sessions complete';
  $('msg').textContent=sum>=28800?'Full day done. Well earned.':sum===0?'Nothing logged yet.':hm(28800-sum)+' left to reach 8 hours.';
  var w=0,cols='';
  for(i=6;i>=0;i--){var k=shift(today,-i),s=daySec(k);w+=s;var c2=s===0?'none':s<23040?'low':'';
    cols+='<div class="col '+c2+'"><em>'+(s?(s/3600).toFixed(1):'')+'</em><i style="height:'+Math.max(2,Math.min(100,s/288)*.85)+'%"></i>'+parse(k).toLocaleDateString(undefined,{weekday:'short'})+'</div>'}
  $('chart').innerHTML=cols;$('wk').textContent=hm(w);$('adh').textContent=Math.round(w/(28800*7)*100)+'%';
  var st=0,k2=today;if(daySec(k2)<23040)k2=shift(k2,-1);while(daySec(k2)>=23040){st++;k2=shift(k2,-1)}
  $('stk').textContent=st;
}
function histPaint(){
  var keys=Object.keys(db.days).filter(function(k){return daySec(k)>0}).sort().reverse().slice(0,30);
  $('hist').innerHTML=keys.length?keys.map(function(k){var s=daySec(k);return'<button data-d="'+k+'"><span>'+parse(k).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})+'</span><span>'+hm(s)+' · '+Math.round(s/288)+'%</span></button>'}).join(''):'<p>No sessions yet. Start a timer to begin.</p>';
}
function upnext(){
  var now=new Date(),nm=now.getHours()*60+now.getMinutes(),el=$('upnext'),html='';
  if(db.timer){el.style.display='none';return}
  el.style.display='flex';
  for(var i=0;i<4;i++){
    var t=(db.times[i]||'').split(':');if(t.length<2)continue;var m=+t[0]*60+ +t[1];
    var s=sess(fmt(now),i);
    if(nm>=m&&nm<m+120&&s<CAP){html='<span><b>Session '+(i+1)+'</b> is due now.</span><button class="b p" data-go="'+i+'">Start</button>';break}
    if(m>nm){var df=m-nm;html='<span>Next: <b>Session '+(i+1)+'</b> at '+db.times[i]+', in '+hm(df*60)+'.</span><button class="b" data-go="'+i+'">Start early</button>';break}
  }
  el.innerHTML=html||'<span>No more scheduled sessions today. Log extra time any time.</span>';
  if(!html)el.lastChild&&0;
}
var upKey='';
function tick(){
  var f=$('focus');
  if(db.timer){
    var t=db.timer,ph=phase();
    if(sess(t.date,t.i)>=CAP){stopTimer();beep(3);toast('Session '+(t.i+1)+' complete: 2 hours logged.');render();return}
    if(lastKey&&ph.key!==lastKey){beep(ph.brk?2:1);toast(ph.brk?'Break time: stand up, drink water.':'Back to focus.')}
    lastKey=ph.key;
    f.hidden=false;f.className='focus'+(ph.brk?' brk':'');
    $('fph').textContent=(ph.brk?'Break':'Focus')+' · Session '+(t.i+1)+' · Round '+ph.n;
    $('fbig').textContent=mmss(ph.left);
    var sub=get(t.date)[t.i].sub;
    $('fmeta').textContent=(sub?sub+' · ':'')+hm(CAP-sess(t.date,t.i))+' left in this session';
    document.title=(ph.brk?'Break ':'Focus ')+mmss(ph.left)+' · Study';
  }else{f.hidden=true;document.title='Study Companion'}
  paint();
  var uk=db.timer?'t':Math.floor(Date.now()/60000)+'_'+daySec(fmt(new Date()))/CAP;
  if(uk!==upKey){upKey=uk;upnext()}
  if(!tick.hk||tick.hk!==Math.floor(Date.now()/10000)+'_'+(db.timer?1:0)){tick.hk=Math.floor(Date.now()/10000)+'_'+(db.timer?1:0);histPaint()}
}

document.addEventListener('click',function(e){
  var el=e.target.closest('button');if(!el)return;
  if(el.dataset.go!==undefined){cur=fmt(new Date());startTimer(+el.dataset.go);return}
  if(el.dataset.tm!==undefined){var i=+el.dataset.tm;if(running(cur,i)){stopTimer();render()}else startTimer(i);return}
  if(el.dataset.a){var p=el.dataset.a.split('|'),i2=+p[0],x=get(cur)[i2];
    if(running(cur,i2))stopTimer();
    if(p[1]==='full')x.sec=CAP;else if(p[1]==='0')x.sec=0;else x.sec=Math.max(0,(+x.sec||0)+ +p[1]*60);
    save();render();return}
  if(el.dataset.chip!==undefined){var xx=get(cur)[+el.dataset.ci];xx.sub=el.dataset.chip;save();document.querySelector('[data-s="'+el.dataset.ci+'"]').value=xx.sub;return}
  if(el.dataset.d){cur=el.dataset.d;render();window.scrollTo(0,0);return}
  switch(el.id){
    case'prev':cur=shift(cur,-1);render();break;
    case'next':if(cur<fmt(new Date())){cur=shift(cur,1);render()}break;
    case'today':cur=fmt(new Date());render();break;
    case'fstop':stopTimer();render();toast('Session saved.');break;
    case'fskip':db.timer.start-=phase().left*1000;save();tick();break;
    case'exp':var s=JSON.stringify({v:2,days:db.days,times:db.times,cfg:db.cfg});$('data').classList.add('on');$('ta').value=s;$('ta').select();
      try{navigator.clipboard.writeText(s).then(function(){toast('Backup copied.')},function(){toast('Copy blocked: select the text and copy it.')})}catch(er){toast('Copy blocked: select the text and copy it.')}break;
    case'imp':$('data').classList.add('on');$('ta').value='';$('ta').focus();break;
    case'load':try{var o=JSON.parse($('ta').value);if(!o||!o.days)throw 0;stopTimer();db.days=o.days;if(o.times)db.times=o.times;if(o.cfg)db.cfg=Object.assign(db.cfg,o.cfg);save();render();toast('Backup restored.')}catch(er){toast('That is not a valid backup.')}break;
    case'clr':if(el.dataset.sure){db={days:{},times:DEF.slice(),timer:null,cfg:db.cfg};save();render();el.textContent='Clear all data';delete el.dataset.sure}else{el.dataset.sure=1;el.textContent='Tap again to confirm'}break;
  }
});
document.addEventListener('input',function(e){
  var t=e.target,d=get(cur);
  if(t.dataset.s!==undefined)d[+t.dataset.s].sub=t.value;
  else if(t.dataset.n!==undefined)d[+t.dataset.n].note=t.value;
  else if(t.dataset.t!==undefined){db.times[+t.dataset.t]=t.value;upKey=''}
  else if(t.id==='cf'||t.id==='cb'){var v=Math.max(1,Math.min(90,+t.value||0));if(t.id==='cf')db.cfg.focus=Math.max(10,v);else db.cfg.brk=v}
  else if(t.id==='cs')db.cfg.sound=t.checked;
  else return;
  save();
});
document.addEventListener('visibilitychange',tick);
setInterval(function(){if(db.timer&&db.timer.date!==cur&&0)return;tick()},1000);
if(db.timer)lastKey=phase().key;
render();
</script>
</body>
</html>
